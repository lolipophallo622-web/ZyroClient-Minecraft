name: Build ZyroClient

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name ZyroClient zyroclient.py
      - uses: actions/upload-artifact@v4
        with:
          name: ZyroClient
          path: dist/ZyroClient.exe
